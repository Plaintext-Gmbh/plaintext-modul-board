# Bau und Tests (Karte 2193, Muster zeiterfassung/notizen). Laeuft im LAN-Runner,
# weil maven.plaintext.ch nur dort erreichbar ist. Keine Secrets: Lesen aus Reposilite braucht keine Anmeldung.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  bauen:
    image: maven:3.10-eclipse-temurin-25
    commands:
      # TEMPORAER (Diagnose CI-Rot): Surefire-Auszug bei Fehlschlag, wird nach der Ursachenfindung wieder entfernt.
      - |
        mvn -B -Dmaven.build.cache.enabled=false clean verify || {
          for f in $(find . -path "*/surefire-reports/*.txt"); do echo "===== $f"; tail -50 "$f"; done
          exit 1
        }
      - bash -n ci/release.sh && bash -n ci/registry.sh
